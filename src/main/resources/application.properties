spring.application.name=cinema

spring.datasource.url=jdbc:postgresql://localhost:5432/CinemaDB
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT - en producción, sobreescribir con la variable de entorno JWT_SECRET (mínimo 256 bits / 32 caracteres)
jwt.secret=${JWT_SECRET:cambiar-este-secreto-de-desarrollo-por-uno-real-y-largo}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS - orígenes permitidos a llamar la API (el front de React en desarrollo)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Usuario ADMIN sembrado al arrancar (solo si no existe ya un usuario con ese email).
# En producción, sobreescribir ADMIN_EMAIL/ADMIN_PASSWORD con credenciales reales.
admin.seed.email=${ADMIN_EMAIL:admin}
admin.seed.password=${ADMIN_PASSWORD:admin}

# API externa de películas (se importan al iniciar y todos los días a las 03:00).
# Si queda vacía, la importación se omite y la app arranca igual.
api.externa.url=${API_EXTERNA_URL:}
