spring.application.name=cinema

spring.datasource.url=jdbc:postgresql://localhost:5432/CinemaDB
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT - en producción, sobreescribir con la variable de entorno JWT_SECRET (mínimo 256 bits / 32 caracteres)
jwt.secret=${JWT_SECRET:cambiar-este-secreto-de-desarrollo-por-uno-real-y-largo}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS - orígenes permitidos a llamar la API (el front de React en desarrollo)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}